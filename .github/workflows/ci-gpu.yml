name: ci-gpu

# Compile-only GPU backend coverage + downloadable test binaries.
#
# GitHub-hosted runners have no NVIDIA/AMD GPU, so this workflow validates
# that the CUDA and Vulkan backends BUILD and LINK -- the per-backend
# combine/link contract and the ggml-<backend> archive actually landing in
# the binary -- NOT that kernels run. Runtime backend registration (cuInit
# / vkCreateInstance finding a device) is out of scope here; that needs a
# real GPU runner. After the link assertion it strips and uploads the
# binary as an artifact so users can download and try a GPU build without
# building it themselves (it still requires a matching GPU + driver to do
# anything beyond CPU fallback at runtime).
#
# Manual trigger only for now (workflow_dispatch). Promote to a nightly
# `schedule:` once it has proven stable across a few runs and the per-run
# cost is understood. See TODO.md "CI matrix for Vulkan + CUDA on Linux
# x86_64".
#
# Conventions adopted from the sibling cyllama build-gpu-wheels.yml:
#   - GGML_NATIVE=OFF        : reproducible, not tuned to the runner CPU
#   - CMAKE_CUDA_ARCHITECTURES=75 : single arch keeps the nvcc compile cheap
#   - ccache                 : cache compiled objects across runs (the big
#                              lever on nvcc cost). Forwarded into the deps
#                              build by scripts/manage.py.
#   - --no-sd-examples       : skip sd-cli/sd-server (chimera does not link
#                              them) via the Makefile DEPS_EXTRA passthrough

on:
  workflow_dispatch:
    inputs:
      # Run a single leg instead of the full matrix while iterating on a new
      # backend -- e.g. dispatch with `vulkan-windows` to avoid paying for the
      # slow CUDA-Linux nvcc compile on every attempt. Each build job gates on
      # this; `all` (the default) runs everything. The `collect` job is
      # ungated and bundles whatever artifacts the selected legs produced.
      legs:
        description: 'Which build leg(s) to run'
        type: choice
        default: all
        options:
          - all
          - cuda-linux
          - vulkan-linux
          - vulkan-windows
          - cuda-windows

defaults:
  run:
    shell: bash

jobs:
  # --- CUDA -----------------------------------------------------------
  # Runs inside the official CUDA devel image so nvcc + cudart + cublas
  # are present without toolkit-install fragility. The image is minimal
  # (no cmake/git/python), so we apt-install the host toolchain first.
  # CUDA 12.4 matches the sibling cyllama's validated choice against the
  # same upstream ggml/llama lineage. Note: a containerized job cannot run
  # the host-path "free disk space" trick (those paths are outside the
  # container mount namespace); ccache keeps the recompile cheap instead.
  build-cuda:
    name: build (cuda, linux x86_64)
    if: ${{ (github.event.inputs.legs || 'all') == 'all' || github.event.inputs.legs == 'cuda-linux' }}
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    env:
      GGML_NATIVE: "0"
      CMAKE_CUDA_ARCHITECTURES: "75"   # forwarded to deps by manage.py
      CUDAARCHS: "75"                  # read by chimera's own configure
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - name: install host toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates python3 python3-venv zip

      - uses: actions/checkout@v6

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-cuda
          evict-old-files: 7d

      - name: cache thirdparty
        uses: actions/cache@v5
        with:
          path: thirdparty
          key: thirdparty-cuda-${{ hashFiles('scripts/manage.py', 'CMakeLists.txt', 'src/chimera/CMakeLists.txt') }}

      - name: build (cuda)
        run: make build-cuda DEPS_EXTRA=--no-sd-examples

      # Compile-time proof the CUDA backend archive linked into the
      # binary. If GGML_CUDA silently dropped, the registration symbol is
      # absent and this fails -- which is the whole point of a GPU-less
      # build leg. MUST run before the strip step below (strip discards it).
      - name: assert cuda backend linked
        run: |
          test -x build/chimera
          # Materialize symbols to a file before grepping. `nm | grep -q`
          # short-circuits on first match and closes the pipe; nm, still
          # writing (the CUDA binary is large), takes SIGPIPE and exits
          # non-zero, and `set -o pipefail` then reports the whole pipeline
          # as failed even when the symbol WAS present -- a false negative.
          # No pipe, no SIGPIPE.
          nm build/chimera > /tmp/chimera.syms
          if ! grep -q ggml_backend_cuda_reg /tmp/chimera.syms; then
            echo "FAIL: ggml_backend_cuda_reg not found in binary -- CUDA backend did not link" >&2
            echo "--- ggml backend reg symbols present: ---" >&2
            grep -E 'ggml_backend_[a-z]+_reg' /tmp/chimera.syms >&2 || echo "(none)" >&2
            exit 1
          fi
          echo "OK: CUDA backend registration symbol present"

      - name: strip + stage artifact
        run: |
          strip build/chimera
          mkdir -p dist
          cp build/chimera dist/chimera-linux-x86_64-cuda
          (cd dist && sha256sum chimera-linux-x86_64-cuda > chimera-linux-x86_64-cuda.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: chimera-linux-x86_64-cuda
          path: dist/chimera-linux-x86_64-cuda*
          if-no-files-found: error

  # --- Vulkan ---------------------------------------------------------
  # No GPU needed to compile: ggml-vulkan needs the Vulkan headers
  # (libvulkan-dev), the glslc shader compiler, and -- since llama.cpp
  # b9318 -- the SPIRV-Headers CMake package (find_package(SPIRV-Headers
  # CONFIG REQUIRED)), provided by the apt `spirv-headers` package. Plain
  # ubuntu-latest already has cmake/git/python. If the apt glslc proves
  # too old / missing on a future runner image, the robust fallback is to
  # build shaderc/glslc from source (see cyllama build-gpu-wheels.yml).
  #
  # NOTE: this builds on bare ubuntu-latest (currently 24.04 / glibc 2.38),
  # so the artifact will not run on glibc < 2.38 hosts (Ubuntu 22.04, Debian
  # 12, RHEL 9). An earlier attempt to build inside an ubuntu:22.04 container
  # to land a glibc-2.34 floor matching the CUDA leg was reverted: jammy has
  # no `glslc` apt package, and the from-source glslc build was more churn
  # than the portability gain warranted for a manual-only compile-check leg.
  build-vulkan:
    name: build (vulkan, linux x86_64)
    if: ${{ (github.event.inputs.legs || 'all') == 'all' || github.event.inputs.legs == 'vulkan-linux' }}
    runs-on: ubuntu-latest
    env:
      GGML_NATIVE: "0"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: install vulkan build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslc glslang-tools spirv-headers zip

      # b9318 ggml-vulkan does find_package(SPIRV-Headers CONFIG REQUIRED).
      # The apt `spirv-headers` package's CMake config lands under /usr/lib,
      # /usr/lib/<arch> or /usr/share depending on the distro image. Locate
      # SPIRV-HeadersConfig.cmake and pre-emptively hint the deps configure
      # (which inherits this job's env): SPIRV-Headers_DIR points config-mode
      # search straight at the dir, and the install prefix is added to
      # CMAKE_PREFIX_PATH as a fallback. Both env vars are honored by CMake's
      # find_package config-mode search and propagate into the manage.py
      # cmake subprocess.
      - name: hint SPIRV-Headers location
        run: |
          cfg=$(find /usr -name 'SPIRV-HeadersConfig.cmake' 2>/dev/null | head -n1)
          if [ -z "$cfg" ]; then
            echo "ERROR: SPIRV-HeadersConfig.cmake not found after apt install spirv-headers" >&2
            find /usr -iname '*spirv-headers*' 2>/dev/null >&2 || true
            exit 1
          fi
          dir=$(dirname "$cfg")
          # Strip a trailing lib/cmake/<name> or share/cmake/<name> to recover
          # the install prefix for CMAKE_PREFIX_PATH.
          prefix=$(printf '%s\n' "$dir" | sed -E 's#/(lib|share)(/[^/]+)?/cmake/SPIRV-Headers/?$##')
          echo "SPIRV-Headers_DIR=$dir" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${prefix}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "hinted SPIRV-Headers_DIR=$dir (prefix=$prefix)"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-vulkan
          evict-old-files: 7d

      - name: cache thirdparty
        uses: actions/cache@v5
        with:
          path: thirdparty
          key: thirdparty-vulkan-${{ hashFiles('scripts/manage.py', 'CMakeLists.txt', 'src/chimera/CMakeLists.txt') }}

      - name: build (vulkan)
        run: make build-vulkan DEPS_EXTRA=--no-sd-examples

      - name: assert vulkan backend linked
        run: |
          test -x build/chimera
          # See the CUDA leg: grep a materialized symbol dump, not a live
          # `nm | grep -q` pipe, to avoid the SIGPIPE-under-pipefail false
          # negative. This leg passed by luck before (smaller binary); make
          # it robust too.
          nm build/chimera > /tmp/chimera.syms
          if ! grep -q ggml_backend_vk_reg /tmp/chimera.syms; then
            echo "FAIL: ggml_backend_vk_reg not found in binary -- Vulkan backend did not link" >&2
            echo "--- ggml backend reg symbols present: ---" >&2
            grep -E 'ggml_backend_[a-z]+_reg' /tmp/chimera.syms >&2 || echo "(none)" >&2
            exit 1
          fi
          echo "OK: Vulkan backend registration symbol present"

      - name: strip + stage artifact
        run: |
          strip build/chimera
          mkdir -p dist
          cp build/chimera dist/chimera-linux-x86_64-vulkan
          (cd dist && sha256sum chimera-linux-x86_64-vulkan > chimera-linux-x86_64-vulkan.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: chimera-linux-x86_64-vulkan
          path: dist/chimera-linux-x86_64-vulkan*
          if-no-files-found: error

  # --- Vulkan (Windows) -----------------------------------------------
  # Same compile-only contract as the Linux Vulkan leg, on MSVC. windows-latest
  # ships VS2022 + git-bash + make + chocolatey, but NOT the Vulkan SDK, so we
  # `choco install vulkan-sdk` to get the loader import lib (vulkan-1.lib),
  # headers, glslc.exe (the shader compiler ggml-vulkan's vulkan-shaders-gen
  # needs), and the SPIRV-Headers CMake config that b9318's
  # find_package(SPIRV-Headers CONFIG REQUIRED) wants -- all bundled in the
  # one SDK, so there is no jammy-style glslc gap here.
  #
  # Two MSVC-specific departures from the Linux leg: (1) the backend-linked
  # assertion uses `dumpbin /DEPENDENTS` to confirm the exe IMPORTS
  # vulkan-1.dll -- a release .exe has no embedded symbol table to `nm`, so we
  # check the DLL import (the Windows analog of Linux DT_NEEDED); (2) no strip
  # (not shipped on the Windows runner; the .exe carries no debug info, the PDB
  # is a separate file we never copy).
  build-vulkan-windows:
    name: build (vulkan, windows x86_64)
    if: ${{ (github.event.inputs.legs || 'all') == 'all' || github.event.inputs.legs == 'vulkan-windows' }}
    runs-on: windows-latest
    env:
      GGML_NATIVE: "0"
    steps:
      - uses: actions/checkout@v6

      # Puts cl.exe + dumpbin.exe on PATH and sets the MSVC env CMake's
      # default "Visual Studio 17 2022" generator picks up.
      - name: setup msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: install vulkan sdk
        run: |
          choco install vulkan-sdk -y --no-progress
          # choco drops the SDK under C:\VulkanSDK\<version> and sets a
          # MACHINE-level VULKAN_SDK env var -- which is NOT visible to later
          # steps in this running job. Locate the newest install ourselves and
          # publish VULKAN_SDK (so CMake's FindVulkan resolves the loader +
          # glslc) plus CMAKE_PREFIX_PATH (so the deps configure's
          # find_package(SPIRV-Headers CONFIG REQUIRED) resolves the SDK's
          # bundled config) into the job env. glslc's dir also goes on PATH for
          # vulkan-shaders-gen.
          sdk=$(ls -d /c/VulkanSDK/* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$sdk" ]; then
            echo "::error::Vulkan SDK not found under C:\\VulkanSDK after choco install" >&2
            ls -la /c/VulkanSDK 2>&1 || true
            exit 1
          fi
          sdk_win=$(cygpath -w "$sdk")
          {
            echo "VULKAN_SDK=$sdk_win"
            echo "CMAKE_PREFIX_PATH=$sdk_win${CMAKE_PREFIX_PATH:+;$CMAKE_PREFIX_PATH}"
          } >> "$GITHUB_ENV"
          echo "$sdk/Bin" >> "$GITHUB_PATH"
          echo "located Vulkan SDK: $sdk_win"
          "$sdk/Bin/glslc.exe" --version || true

      - name: cache thirdparty
        uses: actions/cache@v5
        with:
          path: thirdparty
          key: thirdparty-vulkan-windows-${{ hashFiles('scripts/manage.py', 'CMakeLists.txt', 'src/chimera/CMakeLists.txt') }}

      # Same Makefile target + DEPS_EXTRA passthrough as the Linux leg; make
      # is available in the runner's git-bash (the CPU `ci.yml` Windows leg
      # already drives `make build` this way). The target's
      # `cmake --build --config Release` handles MSVC's multi-config layout,
      # emitting build/Release/chimera.exe.
      - name: build (vulkan)
        run: make build-vulkan DEPS_EXTRA=--no-sd-examples

      - name: assert vulkan backend linked
        run: |
          exe=build/Release/chimera.exe
          if [ ! -f "$exe" ]; then
            echo "FAIL: $exe not found" >&2
            ls -la build build/Release 2>&1 || true
            exit 1
          fi
          # `//DEPENDENTS` (not `/DEPENDENTS`): git-bash's msys path-mangling
          # would otherwise rewrite a leading-slash arg into a Windows path.
          # The doubled slash collapses back to `/DEPENDENTS` for dumpbin.
          dumpbin //DEPENDENTS "$exe" > /tmp/deps.txt
          cat /tmp/deps.txt
          if ! grep -qi 'vulkan-1.dll' /tmp/deps.txt; then
            echo "FAIL: vulkan-1.dll not among imports -- Vulkan backend did not link" >&2
            exit 1
          fi
          echo "OK: vulkan-1.dll import present (Vulkan backend linked)"

      - name: stage artifact
        run: |
          mkdir -p dist
          cp build/Release/chimera.exe dist/chimera-windows-x86_64-vulkan.exe
          (cd dist && \
            (sha256sum chimera-windows-x86_64-vulkan.exe 2>/dev/null \
              || shasum -a 256 chimera-windows-x86_64-vulkan.exe) \
            > chimera-windows-x86_64-vulkan.exe.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: chimera-windows-x86_64-vulkan
          path: dist/chimera-windows-x86_64-vulkan.exe*
          if-no-files-found: error

  # --- CUDA (Windows) -------------------------------------------------
  # Same compile-only contract as the Linux CUDA leg, on MSVC + nvcc.
  # windows-latest has no CUDA toolkit, so Jimver/cuda-toolkit installs nvcc +
  # cudart + cublas (+ the Visual Studio integration the VS generator needs to
  # compile .cu via MSBuild). CUDA 12.4.1 matches the Linux container's
  # version, and CMAKE_CUDA_ARCHITECTURES=75 pins a single arch to bound the
  # (slow) nvcc compile -- exactly the leg the `legs: cuda-windows` selector
  # exists to run in isolation.
  #
  # Built with the Ninja generator (CMAKE_GENERATOR below), NOT the default
  # "Visual Studio 17 2022" generator. The VS generator + CUDA's MSBuild
  # integration serializes nvcc across ggml-cuda's hundreds of kernel
  # template-instance .cu files; Ninja parallelizes them across the runner's
  # cores, cutting the cold build from ~75 min toward ~20. Single-config Ninja
  # ignores the `--config Release` cmake_build() passes and upstream
  # ggml/llama only auto-default Release on NOT-MSVC, so scripts/manage.py's
  # cmake_config injects CMAKE_BUILD_TYPE=Release when CMAKE_GENERATOR names a
  # single-config generator -- without that, this leg would ship unoptimized.
  #
  # Heads-up for the first run: (1) the Jimver action ref below is pinned but
  # was not verifiable locally -- bump it if the install step 404s; (2) the
  # CUDA toolkit + build is large and the Windows runner has limited disk, so
  # watch for an out-of-space failure (no host-path free-disk trick exists on
  # Windows); (3) no ccache here -- it barely helps MSVC+nvcc, so the cold
  # build is the real cost and the thirdparty cache amortizes reruns (when the
  # cache survives -- Actions evicts after 7 days idle, so a rarely-run leg
  # often pays the cold cost, which is why the Ninja speedup matters).
  build-cuda-windows:
    name: build (cuda, windows x86_64)
    if: ${{ (github.event.inputs.legs || 'all') == 'all' || github.event.inputs.legs == 'cuda-windows' }}
    runs-on: windows-latest
    env:
      GGML_NATIVE: "0"
      CMAKE_CUDA_ARCHITECTURES: "75"   # forwarded to deps by manage.py
      CUDAARCHS: "75"                  # read by chimera's own configure
      CMAKE_GENERATOR: "Ninja"         # parallel nvcc; see header comment
    steps:
      - uses: actions/checkout@v6

      - name: setup msvc
        uses: ilammy/msvc-dev-cmd@v1

      # Installs nvcc/cudart/cublas and sets CUDA_PATH + adds the toolkit bin
      # to PATH, which CMake's enable_language(CUDA) / FindCUDAToolkit pick up.
      # visual_studio_integration is required for the default "Visual Studio
      # 17 2022" generator to compile .cu files; thrust + cuda_profiler_api
      # cover headers ggml-cuda includes. NOTE: pin verified-by-bump only.
      - name: install cuda toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration", "cuda_profiler_api"]'

      - name: toolchain info
        run: |
          echo "CUDA_PATH=$CUDA_PATH"
          nvcc --version
          # Ninja ships with the VS C++ CMake component and is on PATH after
          # the msvc-dev-cmd step. If absent, CMAKE_GENERATOR=Ninja fails the
          # configure with a clear "CMAKE_MAKE_PROGRAM not found" -- surface it
          # here first.
          ninja --version

      - name: cache thirdparty
        uses: actions/cache@v5
        with:
          path: thirdparty
          key: thirdparty-cuda-windows-${{ hashFiles('scripts/manage.py', 'CMakeLists.txt', 'src/chimera/CMakeLists.txt') }}

      - name: build (cuda)
        run: make build-cuda DEPS_EXTRA=--no-sd-examples

      - name: assert cuda backend linked
        run: |
          # Ninja (single-config) emits build/chimera.exe; the VS generator
          # would emit build/Release/chimera.exe. Probe both so this stays
          # generator-agnostic.
          exe=build/chimera.exe
          [ -f "$exe" ] || exe=build/Release/chimera.exe
          if [ ! -f "$exe" ]; then
            echo "FAIL: chimera.exe not found under build/ or build/Release/" >&2
            ls -la build build/Release 2>&1 || true
            exit 1
          fi
          # See the Vulkan-Windows leg: `//DEPENDENTS` dodges git-bash msys
          # path-mangling. A release .exe has no symbol table to `nm`, so we
          # assert the CUDA runtime imports instead -- if ggml-cuda linked, the
          # exe imports the dynamic CUDA runtime + cuBLAS DLLs. Grep the
          # major-versioned stem (cudart64_ / cublas64_) to stay robust to the
          # exact minor in the DLL name.
          dumpbin //DEPENDENTS "$exe" > /tmp/deps.txt
          cat /tmp/deps.txt
          missing=
          grep -qi 'cudart64_' /tmp/deps.txt || missing="$missing cudart"
          grep -qi 'cublas64_' /tmp/deps.txt || missing="$missing cublas"
          if [ -n "$missing" ]; then
            echo "FAIL: CUDA runtime import(s) absent:$missing -- CUDA backend did not link" >&2
            exit 1
          fi
          echo "OK: cudart64_/cublas64_ imports present (CUDA backend linked)"

      - name: stage artifact
        run: |
          mkdir -p dist
          exe=build/chimera.exe
          [ -f "$exe" ] || exe=build/Release/chimera.exe
          cp "$exe" dist/chimera-windows-x86_64-cuda.exe
          (cd dist && \
            (sha256sum chimera-windows-x86_64-cuda.exe 2>/dev/null \
              || shasum -a 256 chimera-windows-x86_64-cuda.exe) \
            > chimera-windows-x86_64-cuda.exe.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: chimera-windows-x86_64-cuda
          path: dist/chimera-windows-x86_64-cuda.exe*
          if-no-files-found: error

  # --- Collect --------------------------------------------------------
  # Roll the CUDA + Vulkan artifacts (each a stripped binary + its .sha256)
  # into one downloadable bundle so both GPU builds come down in a single
  # click. Merge subaction: stitches the already-uploaded artifacts over the
  # API, no rebuild. Per-backend artifacts are KEPT (delete-merged: false)
  # so the single-backend download still works.
  #
  # if: always() so a green backend is still collected when the other fails.
  # Merge errors only if NO artifact matched (both legs failed) -- fine,
  # nothing to collect.
  collect:
    name: collect artifacts
    needs: [build-cuda, build-vulkan, build-vulkan-windows, build-cuda-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: merge GPU artifacts into one bundle
        uses: actions/upload-artifact/merge@v7
        with:
          name: chimera-gpu-all
          pattern: chimera-*
          delete-merged: false
